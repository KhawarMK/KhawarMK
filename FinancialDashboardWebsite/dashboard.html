<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - BajwaSales</title>
  <link rel="stylesheet" href="css/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <!-- Navbar -->
    <div class="navbar">
      <div class="logo">
        <img src="images/logo.svg" style="width: 20%; height: 20%;" />
        <h1 class="DSpro">BajwaSales</h1>
      </div>
      <ul class="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="signup.html">Sign Up</a></li>
        <li><a href="dashboard.html" class="clicknavlink">Dashboard</a></li>
      </ul>
    </div>

    <!-- Dashboard Content -->
    <section class="Graohsection">
      <h2 class="section-title">Financial KPIs Overview</h2>

      <div class="graphBody">
        <div class="cardfprcharts">
          <h3 class="graphTitle">Monthly Revenue</h3>
          <canvas id="revenueChart" class="graphkibody"></canvas>
        </div>

        <div class="cardfprcharts">
          <h3 class="graphTitle">Profit Margins</h3>
          <canvas id="profitChart" class="graphkibody"></canvas>
        </div>
      </div>

      <div class="graphBody" style="margin-top: 2rem;">
        <div class="cardfprcharts">
          <h3 class="graphTitle">Sales by Product</h3>
          <canvas id="productChart" class="graphkibody"></canvas>
        </div>

        <div class="cardfprcharts">
          <h3 class="graphTitle">Region Performance</h3>
          <canvas id="regionChart" class="graphkibody"></canvas>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <div class="copyright-text">
      <div class="footer-logo">
        <p class="footer-company">BajwaSales</p>
        <p class="footer-tagline">Unlock Your Sales Potential</p>
      </div>
      <p>&copy; 2025 BajwaSales. All rights reserved.</p>
    </div>
  </div>

  <script src="js/chart-setup.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
