<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | FinanceHub</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script defer src="js/script.js"></script>
</head>
<body>
  <div class="candidate-number">Candidate Number: 2632657</div>
  <header>
    <img src="img/logo.png" alt="FinanceHub Logo" class="logo"/>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="demo.html">Demo KPI Calculator</a></li>
        <li><a href="signup.html" class="active">Sign Up</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="signup-form fade-section">
      <h1>Create Your Account</h1>
      <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required/>
        <label for="email">Email</label>
        <input type="email" id="email" required/>
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6"/>
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" required/>
        <button type="submit">Sign Up</button>
      </form>
    </section>
  </main>
  <div id="signupSuccess" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      <h2>🎉 Welcome to FinanceHub!</h2>
      <p>You’ve successfully signed up. Start exploring your dashboard!</p>
    </div>
  </div>
  <footer>
    <p>&copy; 2025 FinanceHub. Secured & trusted worldwide.</p>
  </footer>
</body>
</html>
